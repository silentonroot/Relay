# Dashboard web server. Serves the static build and proxies /v1 to the broker API so the
# browser talks to one origin (session cookie and CSRF checks rely on that).

upstream broker_api {
    server broker-api:4000;
    keepalive 8;
}

# Host header allow-list. The dashboard is published on loopback only, but a page on another
# origin can make a browser send requests to 127.0.0.1 under an attacker-controlled DNS name
# (DNS rebinding). Requests whose Host is not an expected name are refused with 421.
#
# To change the expected names or port, edit BOTH places below and rebuild the dashboard image:
#   1. `server_name` in the second server block (the name, without port);
#   2. the map (name and published host port; the port is AAB_DASHBOARD_PORT, default 8080,
#      not the container's own 8080).
map $http_host $aab_host_allowed {
    default                  0;
    "localhost:8080"         1;
    "127.0.0.1:8080"         1;
    "[::1]:8080"             1;
}

# Default server: a Host that matches no server_name below lands here.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    return 421;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 [::1];
    server_tokens off;

    # A listed name on the wrong port, or no port, still fails here.
    if ($aab_host_allowed = 0) {
        return 421;
    }

    root /usr/share/nginx/html;
    index index.html;

    # API payloads are small JSON documents.
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        proxy_pass http://broker_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Pass the browser's Host through, and overwrite (never append to) forwarding
        # headers so a client cannot spoof its address to the API's rate limiter.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # The API sets its own security headers; none are added here to avoid duplicates.
    }

    # Fingerprinted build assets. A missing asset is a 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single-page application fallback.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
