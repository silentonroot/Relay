# Included by every location that serves static files. nginx drops inherited add_header
# directives as soon as a location declares its own, so these are included, not inherited.
#
# The policy assumes the dashboard build has no inline scripts, no inline <style> blocks
# and loads nothing from other origins. HSTS is absent because the local setup is plain
# HTTP on loopback; add it at the TLS terminator in any hosted deployment.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
