name: Release

# Delivery, not deployment: AAB is installed and run by its owner, so there is no environment
# for this workflow to deploy to. Pushing a version tag publishes what an owner needs to run a
# release: three container images on GitHub's registry, each with a software bill of materials
# and a signed provenance attestation, and a GitHub release that lists their digests.
#
#   git tag -s v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# Order: the full CI workflow on the tagged commit, then build, scan, push, attest, release.
# A vulnerability with an available fix, or any CI failure, stops the release before anything
# is pushed.
#
# STATUS: NOT YET RUN. See docs/ci-cd.md before the first release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build, scan, push and attest
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release
      packages: write # push images to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
      artifact-metadata: write # storage record that push-to-registry creates by default
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out names
        id: names
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Registry paths must be lower case.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and scan
        # One builder for both steps. Each image is built to an archive and scanned; nothing
        # has reached the registry yet. A docker-container builder is needed for the SBOM and
        # provenance attestations in the next step.
        run: |
          docker buildx create --name release --driver docker-container --use
          mkdir -p "${RUNNER_TEMP}/images"
          for name in broker-api dashboard browser-runner; do
            echo "::group::${name}"
            docker buildx build --pull --file "infra/docker/${name}.Dockerfile" \
              --output "type=docker,dest=${RUNNER_TEMP}/images/${name}.tar" .
            infra/ci/scan-image.sh --archive "${RUNNER_TEMP}/images/${name}.tar"
            echo "::endgroup::"
          done

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push with SBOM and provenance
        id: push
        # Same builder, same context, so every layer comes from the cache of the step above:
        # the layers that are pushed are the layers that were scanned. The labels link the
        # package to this repository and commit.
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          VERSION: ${{ steps.names.outputs.version }}
          PRERELEASE: ${{ steps.names.outputs.prerelease }}
        run: |
          summary=""
          for name in broker-api dashboard browser-runner; do
            tags=(--tag "${PREFIX}/${name}:${VERSION}")
            if [ "${PRERELEASE}" = "false" ]; then tags+=(--tag "${PREFIX}/${name}:latest"); fi
            docker buildx build --push --sbom=true --provenance=mode=max \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --file "infra/docker/${name}.Dockerfile" "${tags[@]}" \
              --metadata-file "${RUNNER_TEMP}/${name}.json" .
            digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "${RUNNER_TEMP}/${name}.json")"
            echo "${name}_digest=${digest}" >> "$GITHUB_OUTPUT"
            summary="${summary}- \`${PREFIX}/${name}:${VERSION}@${digest}\`"$'\n'
          done
          {
            echo 'summary<<END_OF_SUMMARY'
            printf '%s' "${summary}"
            echo 'END_OF_SUMMARY'
          } >> "$GITHUB_OUTPUT"

      - name: Attest the API image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.prefix }}/broker-api
          subject-digest: ${{ steps.push.outputs.broker-api_digest }}
          push-to-registry: true

      - name: Attest the dashboard image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.prefix }}/dashboard
          subject-digest: ${{ steps.push.outputs.dashboard_digest }}
          push-to-registry: true

      - name: Attest the browser-runner image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.prefix }}/browser-runner
          subject-digest: ${{ steps.push.outputs.browser-runner_digest }}
          push-to-registry: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.push.outputs.summary }}
          PRERELEASE: ${{ steps.names.outputs.prerelease }}
        run: |
          {
            echo "## Container images"
            echo
            printf '%s\n' "${SUMMARY}"
            echo "Each image carries an SBOM and a provenance attestation. Verify one with:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://<image>@<digest> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "This software has not been externally reviewed. Read docs/security.md before use."
          } > "${RUNNER_TEMP}/notes.md"
          flags=(--verify-tag --generate-notes --notes-file "${RUNNER_TEMP}/notes.md")
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
