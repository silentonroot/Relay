# Dependency update proposals. Dependabot opens pull requests; nothing is merged automatically,
# and every proposal goes through the same CI as any other change.
#
# `cooldown` keeps a new release from being proposed for a few days after it is published. The
# package manager enforces a separate, shorter minimum release age at install time
# (pnpm-workspace.yaml), so a proposal that arrives too early fails CI instead of installing.
#
# STATUS: exercised on 2026-11-13. All four ecosystems ran and opened pull requests; Dependabot
# finds the `*.Dockerfile` names in infra/docker and updates the pnpm lockfile.
#
# Major versions of the `node` image and of `@types/node` are ignored: the project targets Node 24,
# and a move to a new Node line is deliberate. The first proposal, Node 25, failed the image build.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    # The project targets Node 24, so a new @types/node major is a deliberate decision (it moves
    # with the Node line), not a routine update. Minor and patch updates are still proposed.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One pull request for routine tooling updates; runtime dependencies stay separate so
      # each can be read on its own.
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci

  # Base images in the Dockerfiles, pinned by tag and digest.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    # Node 24 is the project's Node line; a major bump of the base image is a deliberate decision
    # (Node 25 broke the image build). Minor, patch and digest updates are still proposed.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: docker

  # The PostgreSQL image in infra/compose.yaml.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    commit-message:
      prefix: docker
